name: metrics

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Self-hosted stat cards. The public github-readme-stats / profile-trophy /
# activity-graph instances are rate-limited or disabled, so these SVGs are
# generated here and committed into metrics/ instead.
# The cards render with a transparent background and mid-gray text, so a
# single variant reads correctly in both GitHub light and dark themes.
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/base.svg
          base: header, activity, community, repositories
          config_timezone: America/Bogota
          config_display: large

      - name: Language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
